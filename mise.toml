[tools]
node = "24.21.0"
rust = "1.98.1"

[tasks.install]
description = "Install locked npm dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the Tauri desktop app with hot reload"
run = "npm run dev"

[tasks.build]
run = "npm run build"

[tasks.test]
run = "npm test"

[tasks.check]
description = "Install, check formatting, typecheck, test and build"
run = ["npm ci", "npm run check"]

[tasks.format]
description = "Format source, configuration and documentation"
run = "npm run format"

[tasks.start]
description = "Launch the Tauri GUI using built frontend assets"
run = "npm start"

[tasks."build-desktop"]
description = "Build the native desktop executable"
run = "npm run build:desktop"

[tasks."check-desktop"]
description = "Check the Rust desktop host"
run = "npm run check:desktop"
