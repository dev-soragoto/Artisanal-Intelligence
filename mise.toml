[tools]
node = "24.21.0"

[tasks.install]
description = "Install locked npm dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the Fastify API and Vite operator console"
run = "npm run dev"

[tasks.build]
description = "Build the Node server bundle and Vue web assets"
run = "npm run build"

[tasks.test]
run = "npm test"

[tasks.copilot]
description = "Launch GitHub Copilot CLI against the local Artisanal Intelligence service"
run = "npm run copilot --"

[tasks.check]
description = "Install, check formatting, typecheck, test and build"
run = ["npm ci", "npm run check"]

[tasks.format]
description = "Format source, configuration and documentation"
run = "npm run format"

[tasks.start]
description = "Launch the built same-origin Node web server"
run = "npm start"
